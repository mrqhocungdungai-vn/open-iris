<!doctype html>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' blob:;" />
<title>Iris chat</title>
<!-- The 💬 chat window in HUD mode (hud.mjs openChat): the conversation plus the same input box as the main window (compose-ui.js,
     same ids). Clicked with the hand mouse, so every target is 44px. -->
<link rel="stylesheet" href="../renderer/convo.css" />
<link rel="stylesheet" href="chat.css" />
<body class="stage">
<header><b>Iris</b><button id="close" title="Ẩn (Esc)" data-en-title="Hide (Esc)" aria-label="Ẩn" data-en-aria-label="Hide">✕</button></header>
<div id="log" role="log" aria-live="polite" tabindex="0" aria-label="Hội thoại" data-en-aria-label="Conversation" data-empty="Chưa có hội thoại" data-en-empty="No conversation yet"></div>
<button type="button" id="log-jump" hidden data-en="↓ New messages">↓ Tin mới</button>
<p id="error" hidden></p>
<form id="compose">
  <div id="chips"></div>
  <div class="line"><button type="button" id="attach" title="Chọn ảnh hoặc tệp chữ (hoặc kéo thả vào đây)" data-en-title="Pick an image or a text file (or drop it here)" aria-label="Đính kèm" data-en-aria-label="Attach">📎</button><button type="button" id="paste" title="Dán ảnh đang có trong clipboard" data-en-title="Paste the image on the clipboard" aria-label="Dán ảnh" data-en-aria-label="Paste image">📋</button><input id="attach-in" type="file" multiple hidden /><textarea id="say" rows="1" aria-label="Gõ cho Iris" data-en-aria-label="Type to Iris"></textarea><button id="say-send" data-en="Send">Gửi</button></div>
</form>
<script type="module" src="chat.js"></script>
